name: Windows beta build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'ExcelMergerPro-Release.spec'
      - 'ExcelMergerPro-Setup.iss'
      - 'ExcelMergerPro.ico'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run automated tests
        run: python -m pytest -q test_data_types.py test_type_suggestions.py test_merge_integration.py test_join_engine.py

      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean --workpath build_ci --distpath dist ExcelMergerPro-Release.spec

      - name: Archive portable Windows build
        shell: pwsh
        run: Compress-Archive -Path "dist\ExcelMergerPro-Release" -DestinationPath "ExcelMergerPro-Windows.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found at $compiler" }
          & $compiler "ExcelMergerPro-Setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: ExcelMergerPro-Windows-ZIP
          path: ExcelMergerPro-Windows.zip
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ExcelMergerPro-Windows-Setup
          path: installer_output/ExcelMergerPro-Setup-*.exe
          if-no-files-found: error
